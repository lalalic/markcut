name: Relay publication reporting smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report verified existing npm publication using public Relay action
        uses: lalalic/agents-relay/.github/actions/report-publication@publication-v1
        with:
          token: ${{ github.token }}
          artifact: '@lalalic/markcut'
          version: '3.2.15'
          channel: https://registry.npmjs.org
          sha: e039fae0b73d3c13e9cea37f7134926f3d055095
          repository: lalalic/markcut
