name: Publish to npm

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run bounded tests
        timeout-minutes: 10
        uses: lalalic/agents-relay/.github/actions/run-bounded-tests@main
        with:
          command: npm run test:publish

      - name: Choose next version
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$NAME" version 2>/dev/null || echo 0.0.0)
          NEXT=$(node - "$LOCAL" "$REMOTE" <<'NODE'
          const [local, remote] = process.argv.slice(2)
          const core = v => v.replace(/^v/, '').split('-')[0].split('.').map(Number)
          const cmp = (a, b) => {
            const x = core(a), y = core(b)
            for (let i = 0; i < 3; i++) {
              if (x[i] !== y[i]) return x[i] - y[i]
            }
            return 0
          }
          if (cmp(local, remote) > 0) {
            console.log(local)
          } else {
            const [major, minor, patch] = core(remote)
            console.log(`${major}.${minor}.${patch + 1}`)
          }
          NODE
          )
          echo "Publishing $NAME@$NEXT (repo=$LOCAL, registry=$REMOTE)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          npm version "$NEXT" --no-git-tag-version --allow-same-version

      - name: Publish
        id: publish
        run: npm publish --access public --provenance

      - name: Report publication failure to Agents Relay
        id: relay_failure_report
        if: ${{ failure() && steps.publish.outcome == 'failure' }}
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication-failure@publication-v1
        with:
          token: ${{ github.token }}
          stage: npm publish
          sha: ${{ github.sha }}
          repository: ${{ github.repository }}
      # Report the exact package/version prepared for a successful npm publish.
      # Reporting is best-effort and must never change the npm publish result.
      - name: Report successful publication to Agents Relay
        id: relay_report
        if: ${{ steps.publish.outcome == 'success' }}
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication@publication-v1
        with:
          token: ${{ github.token }}
          artifact: ${{ steps.publication.outputs.name }}
          version: ${{ steps.publication.outputs.version }}
          channel: npm
          sha: ${{ github.sha }}
          repository: ${{ github.repository }}

      - name: Summarize publication
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          PACKAGE_NAME: ${{ steps.publication.outputs.name }}
          PACKAGE_VERSION: ${{ steps.publication.outputs.version }}
          REPORT_OUTCOME: ${{ steps.relay_report.outcome }}
        run: |
          echo "Published $PACKAGE_NAME@$PACKAGE_VERSION to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "Relay reporting: $REPORT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Warn when publication reporting fails
        if: ${{ steps.publish.outcome == 'success' && steps.relay_report.outcome == 'failure' }}
        run: echo "::warning::npm publication succeeded but Relay reporting failed; inspect this run. Do not retry npm publication."

      - name: Summarize failure
        if: ${{ failure() }}
        run: |
          echo "npm publication failed. Inspect this run for the failing step." >> "$GITHUB_STEP_SUMMARY"
